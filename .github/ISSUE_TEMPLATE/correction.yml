name: "研究内容の訂正"
description: "古い解釈、アドレスの誤認、証拠の不足を報告する"
title: "[訂正] "
body:
  - type: input
    id: page
    attributes:
      label: 対象ページ・アドレス
      placeholder: "例: reference/symbols/0048D6A0.md"
    validations:
      required: false
  - type: textarea
    id: current
    attributes:
      label: 現在の記載
    validations:
      required: false
  - type: textarea
    id: corrected
    attributes:
      label: 訂正案と根拠
      description: "実測・静的・推定を区別してください"
    validations:
      required: false
  - type: textarea
    id: unfinished
    attributes:
      label: 未検証事項
