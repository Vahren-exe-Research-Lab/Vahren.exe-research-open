name: Publish research site

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "REF_*.md"
      - "reference/**"
      - "CONTRIBUTING.md"
      - "RELEASE_NOTES.md"
      - "SCOPE_AND_LIMITATIONS.md"
      - "EVIDENCE_REFERENCES.md"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "tools/prepare_docs_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build research documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out public sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install documentation builder
        run: python -m pip install -r requirements-docs.txt

      - name: Prepare public-only documents
        run: python -B tools/prepare_docs_site.py

      - name: Build searchable site
        run: python -m mkdocs build --strict

      - name: Confirm generated search index
        shell: bash
        run: |
          test -s site/index.html
          test -s site/search/search_index.json
          python -c 'from pathlib import Path; t=Path("site/search/search_index.json").read_text(encoding="utf8"); assert "0048D6A0" in t, "Missing key address from Pages search index"'

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload documentation artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./site

  deploy:
    name: Deploy research site
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
