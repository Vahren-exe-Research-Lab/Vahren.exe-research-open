name: Retry failed research site publication

# GitHub Pages can occasionally fail while synchronizing files even after
# the site has built successfully. Retry later without human intervention.
on:
  schedule:
    - cron: '29 */12 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: research-pages-recovery
  cancel-in-progress: false

jobs:
  recover:
    name: Retry a failed Pages run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check last Pages run and retry only if it failed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          last="$(gh api "repos/$GH_REPO/actions/workflows/pages.yml/runs?per_page=1&branch=main")"
          status="$(jq -r '.workflow_runs[0].status // "none"' <<< "$last")"
          conclusion="$(jq -r '.workflow_runs[0].conclusion // "none"' <<< "$last")"

          echo "Latest Pages run: status=$status conclusion=$conclusion"
          if [[ "$status" != 'completed' ]]; then
            echo 'Latest Pages run is running or not found; do not stack deployments.'
            exit 0
          fi

          if [[ "$conclusion" == 'success' ]]; then
            echo 'Latest Pages run succeeded; nothing to retry.'
            exit 0
          fi

          echo 'Retrying a failed Pages deployment via workflow_dispatch.'
          gh api --method POST \
            "repos/$GH_REPO/actions/workflows/pages.yml/dispatches" \
            -f ref=main >/dev/null
