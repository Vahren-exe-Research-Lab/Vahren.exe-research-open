name: Research CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# PRs may contain untrusted code. Never grant write access or use pull_request_target.
permissions:
  contents: read

concurrency:
  group: research-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Research data and safety checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Run research and safety regression tests
        run: python -B -m unittest discover -s tests -v

      - name: Verify generated reference pages are up-to-date
        shell: bash
        run: |
          python -B tools/build_reference.py
          git diff --exit-code -- reference/README.md reference/symbols reference/structs

      - name: Smoke-test search CLI
        shell: bash
        run: |
          python -B tools/search.py symbols Battle_ConstructScene --json > /dev/null
          python -B tools/search.py fields hp --json > /dev/null

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Build searchable research docs (no deploy for PRs)
        shell: bash
        run: |
          python -B tools/prepare_docs_site.py
          python -m mkdocs build --strict
          test -s site/index.html
          test -s site/search/search_index.json

      - name: Verify whitespace and unexpected generated changes
        run: git diff --check
